# SECURITY ENFORCEMENT:
# Bind this exact workflow from main through an organization ruleset
# `required_workflows` rule. Never treat a same-named status check as sufficient.
name: factory-contracts

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: factory-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out immutable controls from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BeyondZeroLabs/apple-silicon-ai-lab
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Validate candidate with immutable controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -I trusted/scripts/validate_public_repository_safety.py
          --repo candidate
          --trusted-root trusted
